services:
  backend:
    image: securechat-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}"
    volumes:
      - ./certs:/app/certs:ro
    networks:
      - default
      - cloudflared_net

  frontend:
    image: securechat-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - default
      - cloudflared_net

networks:
  default:
    driver: bridge
  cloudflared_net:
    name: ${DOCKER_NETWORK:-tunnel_network}
    external: true
