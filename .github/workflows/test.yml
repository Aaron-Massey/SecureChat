name: Vitest Tests & Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Backend Tests & Coverage
        run: npm run test:coverage --prefix backend

      - name: Run Frontend Tests & Coverage
        run: npm run test:coverage --prefix frontend

      - name: Add Coverage Summary to GitHub Step Summary
        if: always()
        run: |
          echo "## 🧪 Vitest Test & Coverage Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ All Vitest unit tests executed successfully across backend and frontend." >> $GITHUB_STEP_SUMMARY
